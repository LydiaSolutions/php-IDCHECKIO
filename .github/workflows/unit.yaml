name: PHP unit tests

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: PHPUnit on PHP 8.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring
          tools: composer:v2
          coverage: none
      - run: composer --working-dir=test install --prefer-dist --no-progress --no-interaction
      - run: make unit
